name: governance-ci

# Lab CI (R&D journal). The governance prototype (NCMD authz / SchemaGate /
# OPA policy) graduated to the productized repos under github.com/yggdrasil-iiot
# (bifrost/heimdall/mimir/muninn) — see docs/superpowers/{specs,plans}. The
# gates + OPA-wasm jobs that guarded that prototype were retired with it; the
# remaining lab experiments are covered by the unit-test suite.

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn -B test
        run: mvn -B test
