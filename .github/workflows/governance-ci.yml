name: governance-ci

# Lab CI (R&D journal). The governance prototype (NCMD authz / SchemaGate /
# OPA policy) graduated to the productized repos under github.com/yggdrasil-iiot
# (Bifrost, including its Heimdall module, plus Mimir and Muninn) — see
# docs/design/README.md. The
# gates + OPA-wasm jobs that guarded that prototype were retired with it; the
# remaining lab experiments are covered by the unit-test suite.

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn -B test
        run: mvn -B test
      - name: legacy demos compile (not part of the unit-test count)
        run: mvn -B -f legacy/pre-bifrost/pom.xml compile
  doc-refs:
    name: document references resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: pinned links, checkout instructions and run commands point at things this repository contains
        run: python3 -I scripts/check-doc-refs.py
