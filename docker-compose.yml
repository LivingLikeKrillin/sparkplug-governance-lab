# Local lab services.
#   docker compose up -d   → MQTT on tcp://localhost:1883, Kafka on localhost:9092
#
# ⚠️ HiveMQ CE 2026.x is secure-by-default: without a security extension it refuses ALL MQTT
#    connections ("No security extension present, MQTT clients can not connect").
#    For local development we enable the bundled allow-all extension via
#    HIVEMQ_ALLOW_ALL_CLIENTS=true. Do NOT bind-mount the whole /opt/hivemq/extensions —
#    that hides the bundled extensions (mount subpaths only, see docker-compose.aware.yml).
services:
  hivemq-ce:
    image: hivemq/hivemq-ce:latest
    container_name: sparkplug-hivemq-ce
    ports:
      - "1883:1883"     # MQTT
    environment:
      HIVEMQ_ALLOW_ALL_CLIENTS: "true"
    restart: unless-stopped
  kafka:
    image: apache/kafka:3.7.1
    container_name: sparkplug-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_CLEANUP_POLICY: delete
