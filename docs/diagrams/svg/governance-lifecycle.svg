<svg viewBox="0 0 1100 344" width="1100" height="344" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>Governance lifecycle — the gate opens the loop, drift closes it</title>
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#57606a"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0969da"/></marker>
  </defs>

  <rect x="8" y="8" width="1084" height="328" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- title -->
  <text x="32" y="40" font-size="16" font-weight="600" fill="#1f2328">Governance lifecycle — the gate opens the loop, drift closes it</text>
  <text x="32" y="60" font-size="12" fill="#57606a">pre-deploy gate admits definitions · runtime drift feeds back — the loop closes</text>

  <!-- ===== edges ===== -->
  <g fill="none" stroke-width="1.6">
    <!-- GATE -> REG : governance blue -->
    <polyline points="234,180 320,184" stroke="#0969da" marker-end="url(#ab)"/>
    <!-- REG -> EDGE : data grey -->
    <polyline points="470,184 580,180" stroke="#57606a" marker-end="url(#ag)"/>
    <!-- EDGE -> DRIFT : observation dashed grey -->
    <polyline points="760,180 850,180" stroke="#57606a" stroke-dasharray="5 3" marker-end="url(#ag)"/>
    <!-- REG -> DRIFT : shortcut over the row, data grey -->
    <polyline points="395,146 395,104 950,104 950,152" stroke="#57606a" marker-end="url(#ag)"/>
    <!-- DRIFT -> GATE : feedback, dashed grey, routed under the row (closes the loop) -->
    <polyline points="950,208 950,300 139,300 139,208" stroke="#57606a" stroke-dasharray="5 3" marker-end="url(#ag)"/>
  </g>

  <!-- ===== edge labels (no chips; each beside its line in clear space) ===== -->
  <g font-size="11">
    <text x="240" y="170" fill="#0969da">admit / reject</text>
    <text x="240" y="200" fill="#8b95a1" font-size="10">breaking change</text>
    <text x="497" y="170" fill="#57606a">definitions</text>
    <text x="762" y="170" fill="#57606a">observed NBIRTH</text>
    <text x="655" y="96" fill="#57606a">source of truth</text>
    <text x="404" y="292" fill="#57606a">drift signal — closes the loop</text>
  </g>

  <!-- ===== nodes ===== -->
  <!-- GATE (accent) -->
  <rect x="44" y="152" width="190" height="56" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <g text-anchor="middle">
    <text x="139" y="178" font-size="12.5" font-weight="600" fill="#1f2328">SchemaGate</text>
    <text x="139" y="196" font-size="11" fill="#57606a">pre-deploy, fail-closed</text>
  </g>

  <!-- REG (accent cylinder) -->
  <path d="M320,146 a75,9 0 0 1 150,0 l0,76 a75,9 0 0 1 -150,0 Z" fill="#ddf4ff" stroke="#0969da"/>
  <path d="M320,146 a75,9 0 0 0 150,0" fill="none" stroke="#0969da"/>
  <g text-anchor="middle">
    <text x="395" y="174" font-size="12.5" font-weight="600" fill="#1f2328">UDT registry</text>
    <text x="395" y="192" font-size="11" fill="#57606a">SemVer</text>
    <text x="395" y="208" font-size="11" fill="#57606a">source of truth</text>
  </g>

  <!-- EDGE (default) -->
  <rect x="580" y="152" width="180" height="56" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <g text-anchor="middle">
    <text x="670" y="176" font-size="12.5" fill="#1f2328">Edge Node / UNS</text>
    <text x="670" y="194" font-size="11" fill="#57606a">NBIRTH / NDATA</text>
  </g>

  <!-- DRIFT (default) -->
  <rect x="850" y="152" width="200" height="56" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <g text-anchor="middle">
    <text x="950" y="176" font-size="12.5" fill="#1f2328">DriftMonitor</text>
    <text x="950" y="194" font-size="11" fill="#57606a">runtime, detect-only</text>
  </g>
</svg>
