<svg viewBox="0 0 540 320" width="540" height="320" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Segoe UI,-apple-system,Helvetica,Arial,sans-serif">
  <title>OPC UA to UDT 손실 원장 (9개 멤버): 8건 무손실 / 1건 부가 채널 보존 / 0건 타입 식별자 손실</title>
  <rect x="8" y="8" width="524" height="304" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="44" font-size="16" font-weight="600" fill="#1f2328">OPC UA to UDT — 손실 원장 (예시: 9개 멤버)</text>
  <text x="32" y="64" font-size="12" fill="#57606a">변환 손실의 정량적 산출물화 (ADR-0010)</text>
  <!-- segmented bar: 9 cells, 8 clean + 1 side-channel + 0 type-identity-lost -->
  <g>
    <rect x="32" y="92" width="52" height="40" fill="#1a7f37" stroke="#ffffff"/>
    <rect x="84" y="92" width="52" height="40" fill="#1a7f37" stroke="#ffffff"/>
    <rect x="136" y="92" width="52" height="40" fill="#1a7f37" stroke="#ffffff"/>
    <rect x="188" y="92" width="52" height="40" fill="#1a7f37" stroke="#ffffff"/>
    <rect x="240" y="92" width="52" height="40" fill="#1a7f37" stroke="#ffffff"/>
    <rect x="292" y="92" width="52" height="40" fill="#1a7f37" stroke="#ffffff"/>
    <rect x="344" y="92" width="52" height="40" fill="#1a7f37" stroke="#ffffff"/>
    <rect x="396" y="92" width="52" height="40" fill="#1a7f37" stroke="#ffffff"/>
    <rect x="448" y="92" width="52" height="40" fill="#9a6700" stroke="#ffffff"/>
  </g>
  <text x="32" y="156" font-size="13" font-weight="600" fill="#1f2328">8건 무손실 / 1건 부가 채널 보존 / 0건 타입 식별자 손실</text>
  <!-- legend: 4 LossClasses -->
  <g font-size="11.5" fill="#1f2328">
    <rect x="32" y="186" width="14" height="14" fill="#1a7f37"/><text x="54" y="198">CLEAN (완전 일치) — 8</text>
    <rect x="32" y="212" width="14" height="14" fill="#0969da"/><text x="54" y="224">PRECISION_LOSS (정밀도 축소) — 0</text>
    <rect x="32" y="238" width="14" height="14" fill="#cf222e"/><text x="54" y="250">TYPE_IDENTITY_LOSS (식별자 손실) — 0</text>
    <rect x="32" y="264" width="14" height="14" fill="#9a6700"/><text x="54" y="276">SIDE_CHANNEL_REQUIRED (부가 채널) — 1</text>
  </g>
  <text x="310" y="226" font-size="11" fill="#57606a">무손실 원본 데이터 보존:</text>
  <text x="310" y="244" font-size="11" font-family="ui-monospace,Consolas,monospace" fill="#0969da">ua_ticks / ua_statuscode</text>
</svg>
