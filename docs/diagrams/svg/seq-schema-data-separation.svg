<svg viewBox="0 0 1200 530" width="1200" height="530" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>Schema / data separation — definition once (retained), thin births resolved via schemaRef</title>
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#57606a"/></marker>
  </defs>

  <rect x="8" y="8" width="1184" height="514" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- title -->
  <text x="32" y="40" font-size="16" font-weight="600" fill="#1f2328">Schema / data separation</text>
  <text x="250" y="40" font-size="13" fill="#57606a">definition published once (retained), thereafter only thin births / data flow</text>

  <!-- lifelines -->
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="170" y1="116" x2="170" y2="500"/>
    <line x1="470" y1="116" x2="470" y2="500"/>
    <line x1="770" y1="116" x2="770" y2="500"/>
    <line x1="1060" y1="116" x2="1060" y2="500"/>
  </g>

  <!-- messages (grey data flow, top-to-bottom time order) -->
  <g fill="none" stroke="#57606a" stroke-width="1.6">
    <polyline points="170,160 470,160" marker-end="url(#ag)"/>
    <polyline points="470,210 770,210" marker-end="url(#ag)"/>
    <polyline points="470,260 770,260" marker-end="url(#ag)"/>
    <polyline points="470,310 770,310" marker-end="url(#ag)"/>
    <polyline points="770,360 1060,360" marker-end="url(#ag)"/>
    <polyline points="770,410 1060,410" marker-end="url(#ag)"/>
    <polyline points="770,460 1060,460" marker-end="url(#ag)"/>
  </g>

  <!-- message labels (11px, above each arrow, no background chip) -->
  <g font-size="11" fill="#57606a">
    <text x="176" y="152">1   build Definition (Motor @ 1.1.0)</text>
    <text x="476" y="202">2   DEFINITION - retained, published once</text>
    <text x="476" y="240">3   thin NBIRTH - schemaRef + alias-only</text>
    <text x="494" y="253">162 B vs 328 B inline</text>
    <text x="476" y="302">4   NDATA - alias-only (RBE)</text>
    <text x="776" y="352">5   retained DEFINITION, learn() = NEW</text>
    <text x="776" y="390">6   duplicate DEFINITION, learn() = UNCHANGED</text>
    <text x="794" y="403">(idempotent)</text>
    <text x="776" y="452">7   thin NBIRTH/NDATA, resolved via schemaRef</text>
  </g>

  <!-- participant boxes -->
  <g font-size="12.5" text-anchor="middle">
    <!-- R = Schema Registry (authority) — accent -->
    <rect x="80" y="60" width="180" height="56" rx="6" fill="#ddf4ff" stroke="#0969da"/>
    <text x="170" y="84" font-weight="600" fill="#1f2328">Schema Registry</text>
    <text x="170" y="102" font-size="11" fill="#57606a">(authority)</text>

    <!-- E = Edge Node -->
    <rect x="395" y="60" width="150" height="56" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="470" y="93" fill="#1f2328">Edge Node</text>

    <!-- B = HiveMQ (retained) -->
    <rect x="695" y="60" width="150" height="56" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="770" y="84" fill="#1f2328">HiveMQ</text>
    <text x="770" y="102" font-size="11" fill="#57606a">(retained)</text>

    <!-- C = Consumer -->
    <rect x="985" y="60" width="150" height="56" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="1060" y="93" fill="#1f2328">Consumer</text>
  </g>
</svg>
