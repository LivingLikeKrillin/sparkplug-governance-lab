<svg viewBox="0 0 1280 780" width="1280" height="780" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Segoe UI,-apple-system,Helvetica,Arial,sans-serif">
  <title>PoC 무대 — Yggdrasil 통치 아래 풀 루프가 실제로 돈다: Bifrost 통치를 소비해 Heimdall 엣지가 명령을 재인가·바인딩하고 관측이 UNS로 흐른다</title>
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#57606a"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0969da"/></marker>
    <marker id="aa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9a6700"/></marker>
  </defs>

  <rect x="8" y="8" width="1264" height="764" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <text x="32" y="46" font-size="20" font-weight="700" fill="#1f2328">PoC 무대 — Yggdrasil 통치 아래 풀 루프가 실제로 돈다</text>
  <text x="33" y="72" font-size="12.5" fill="#57606a">observe → command → observe · 통치된 쓰기가 엣지에서 재인가·바인딩되고, rogue는 막힌다</text>

  <!-- governance authority rail (external, consumed) -->
  <rect x="24" y="92" width="1232" height="108" rx="10" fill="#eef5ff" stroke="#cfe0f5"/>
  <text x="40" y="116" font-size="11" font-weight="700" letter-spacing="1" fill="#0969da">YGGDRASIL 통치 권위 — 외부에서 소비 (VERIFY-THEN-TRUST)</text>
  <g font-size="12.5" text-anchor="middle" fill="#1f2328">
    <rect x="48" y="128" width="180" height="60" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="138" y="154" font-weight="600">Mímir</text>
    <text x="138" y="172" font-size="11" fill="#57606a">북향 제안 (설계시)</text>
    <rect x="300" y="126" width="330" height="64" rx="6" fill="#ddf4ff" stroke="#0969da"/>
    <text x="465" y="152" font-weight="600">Bifrost — 통치 권위 (registry-of-record)</text>
    <text x="465" y="170" font-size="11" fill="#57606a">정의 · 정책 · 활성 버전</text>
  </g>
  <text x="700" y="150" font-size="11.5" fill="#57606a">엣지가 통치된 계약을 소비한다 —</text>
  <text x="700" y="169" font-size="11.5" fill="#57606a">정책 · 활성 버전 · conformance (verify-then-trust)</text>

  <!-- edges -->
  <g fill="none" stroke-width="1.6">
    <polyline points="228,158 300,158" stroke="#57606a" marker-end="url(#ag)"/>
    <polyline points="465,190 465,262 902,262 902,296" stroke="#0969da" marker-end="url(#ab)"/>
    <polyline points="228,363 430,363" stroke="#9a6700" marker-end="url(#aa)"/>
    <polyline points="620,344 780,342" stroke="#9a6700" marker-end="url(#aa)"/>
    <polyline points="1024,342 1044,342 1044,357 1064,357" stroke="#9a6700" marker-end="url(#aa)"/>
    <polyline points="1152,392 1152,486 560,486 560,420" stroke="#57606a" marker-end="url(#ag)"/>
    <polyline points="490,420 490,542" stroke="#57606a" marker-end="url(#ag)"/>
    <polyline points="620,574 720,571" stroke="#57606a" marker-end="url(#ag)"/>
    <polyline points="810,592 810,706 138,706 138,396" stroke="#57606a" stroke-dasharray="5 3" marker-end="url(#ag)"/>
  </g>

  <!-- edge labels (no chips, beside lines) -->
  <g font-size="11">
    <text x="232" y="150" fill="#57606a">정의 제안</text>
    <text x="596" y="256" fill="#0969da">정책 · 활성 버전 · conformance</text>
    <text x="300" y="356" fill="#9a6700">NCMD 1500</text>
    <text x="676" y="334" fill="#9a6700">명령</text>
    <text x="1027" y="328" fill="#9a6700">APPLY</text>
    <text x="852" y="480" fill="#57606a">NDATA (관측)</text>
    <text x="496" y="492" fill="#57606a">발행</text>
    <text x="628" y="564" fill="#57606a">→ UNS</text>
    <text x="360" y="700" fill="#57606a">observe → command — 루프가 닫힌다 (관측이 다음 명령을 정보화)</text>
  </g>

  <!-- runtime stage nodes -->
  <g font-size="12.5" text-anchor="middle" fill="#1f2328">
    <rect x="48" y="330" width="180" height="66" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="138" y="360" font-weight="600">Command publisher</text>
    <text x="138" y="378" font-size="11" fill="#57606a">NCMD (setpoint)</text>

    <rect x="430" y="316" width="190" height="104" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="525" y="352" font-weight="600">HiveMQ 브로커</text>
    <text x="525" y="370" font-size="11" fill="#57606a">Sparkplug B</text>
    <text x="525" y="388" font-size="11" fill="#57606a">pub / sub</text>

    <rect x="780" y="296" width="244" height="92" rx="6" fill="#eaf3ea" stroke="#1a7f37"/>
    <text x="902" y="324" font-weight="700">Heimdall · 런타임 엣지</text>
    <text x="902" y="342" font-size="11" fill="#57606a">deny-by-default 재인가</text>
    <text x="902" y="360" font-size="11" fill="#57606a">conformance · 활성 버전 바인딩</text>
    <text x="902" y="378" font-size="11" fill="#57606a">fail-closed</text>

    <rect x="1064" y="322" width="176" height="70" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="1152" y="352" font-weight="600">OPC-UA sim (현장)</text>
    <text x="1152" y="370" font-size="11" fill="#57606a">Rpm PV</text>

    <rect x="430" y="542" width="190" height="64" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="525" y="570" font-weight="600">Muninn · 북향 피더</text>
    <text x="525" y="588" font-size="11" fill="#57606a">NDATA → UNS</text>

    <path d="M720,557 a90,9 0 0 1 180,0 l0,38 a90,9 0 0 1 -180,0 Z" fill="#f6f8fa" stroke="#d0d7de"/>
    <path d="M720,557 a90,9 0 0 0 180,0" fill="none" stroke="#d0d7de"/>
    <text x="810" y="582" font-weight="600">UNS</text>
    <text x="810" y="598" font-size="11" fill="#57606a">통합 네임스페이스</text>
  </g>

  <text x="902" y="406" font-size="11" text-anchor="middle" fill="#cf222e">✕ rogue · above-max → DENY (fail-closed)</text>
</svg>
