<svg viewBox="0 0 1280 740" width="1280" height="740" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>Sparkplug B / UNS governance — system architecture: OT/Edge to HiveMQ to IT consumers, with a policy-as-code governance plane</title>
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#57606a"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0969da"/></marker>
    <marker id="aa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9a6700"/></marker>
  </defs>

  <rect x="8" y="8" width="1264" height="724" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- lanes -->
  <rect x="24" y="150" width="392" height="566" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="40" y="174" font-size="11" font-weight="700" letter-spacing="1" fill="#8b95a1">OT / EDGE</text>
  <rect x="436" y="150" width="300" height="566" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="452" y="174" font-size="11" font-weight="700" letter-spacing="1" fill="#8b95a1">HIVEMQ CE</text>
  <rect x="756" y="150" width="500" height="566" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="772" y="174" font-size="11" font-weight="700" letter-spacing="1" fill="#8b95a1">IT / CONSUMERS</text>

  <!-- governance rail -->
  <rect x="24" y="28" width="1232" height="104" rx="10" fill="#eef5ff" stroke="#cfe0f5"/>
  <text x="40" y="50" font-size="11" font-weight="700" letter-spacing="1" fill="#0969da">GOVERNANCE · policy-as-code</text>

  <!-- ===== edges ===== -->
  <g fill="none" stroke-width="1.6">
    <!-- data flow grey -->
    <polyline points="160,242 160,256 125,256 125,272" stroke="#57606a" marker-end="url(#ag)"/>
    <polyline points="125,330 125,452 180,452 180,474" stroke="#57606a" marker-end="url(#ag)"/>
    <polyline points="307,330 307,452 252,452 252,474" stroke="#57606a" marker-end="url(#ag)"/>
    <polyline points="310,488 440,488 440,460 476,460" stroke="#57606a" marker-end="url(#ag)"/>
    <polyline points="216,532 216,569 476,569" stroke="#57606a" marker-end="url(#ag)"/>
    <polyline points="686,434 742,434 742,352 800,352" stroke="#57606a" marker-end="url(#ag)"/>
    <polyline points="686,569 762,569 762,368 800,368" stroke="#57606a" marker-end="url(#ag)"/>
    <polyline points="686,466 720,466 720,480 800,480" stroke="#57606a" marker-end="url(#ag)"/>
    <polyline points="910,508 910,572" stroke="#57606a" marker-end="url(#ag)"/>
    <!-- governance blue -->
    <polyline points="244,91 280,91 280,46 665,46 665,60" stroke="#0969da" marker-end="url(#ab)"/>
    <polyline points="405,122 405,250 307,250 307,272" stroke="#0969da" marker-end="url(#ab)"/>
    <polyline points="665,122 665,158 420,158 420,503 310,503" stroke="#0969da" marker-end="url(#ab)"/>
    <!-- observation dashed -->
    <polyline points="581,420 581,228 800,228" stroke="#57606a" stroke-dasharray="5 3" marker-end="url(#ag)"/>
    <polyline points="770,91 910,91 910,200" stroke="#57606a" stroke-dasharray="5 3" marker-end="url(#ag)"/>
    <!-- command amber -->
    <polyline points="885,386 885,408 710,408 710,452 686,452" stroke="#9a6700" marker-end="url(#aa)"/>
  </g>

  <!-- ===== edge labels ===== -->
  <g font-size="11">
    <g><rect x="166" y="250" width="78" height="16" fill="#fbfcfd"/><text x="170" y="262" fill="#57606a">browse / read</text></g>
    <g><rect x="430" y="34" width="84" height="16" fill="#eef5ff"/><text x="434" y="46" fill="#0969da">admit / reject</text></g>
    <g><rect x="312" y="242" width="46" height="16" fill="#fbfcfd"/><text x="316" y="254" fill="#0969da">project</text></g>
    <g><rect x="424" y="316" width="74" height="16" fill="#fbfcfd"/><text x="428" y="328" fill="#0969da">definitions</text></g>
    <g><rect x="60" y="436" width="86" height="16" fill="#fbfcfd"/><text x="64" y="448" fill="#57606a">UdtDefinition</text></g>
    <g><rect x="312" y="436" width="68" height="16" fill="#fbfcfd"/><text x="316" y="448" fill="#57606a">ALLOW only</text></g>
    <g><rect x="316" y="494" width="120" height="16" fill="#fbfcfd"/><text x="320" y="506" fill="#57606a">thin NBIRTH / NDATA</text></g>
    <g><rect x="300" y="556" width="100" height="16" fill="#fbfcfd"/><text x="304" y="568" fill="#57606a">DEFINITION, once</text></g>
    <g><rect x="800" y="80" width="88" height="16" fill="#eef5ff"/><text x="804" y="92" fill="#57606a">source of truth</text></g>
    <g><rect x="588" y="306" width="94" height="16" fill="#fbfcfd"/><text x="592" y="318" fill="#57606a">passive observe</text></g>
    <g><rect x="690" y="356" width="78" height="16" fill="#fbfcfd"/><text x="694" y="368" fill="#57606a">learn schema</text></g>
    <g><rect x="716" y="396" width="42" height="16" fill="#fbfcfd"/><text x="720" y="408" fill="#9a6700">NCMD</text></g>
    <g><rect x="916" y="532" width="124" height="16" fill="#fbfcfd"/><text x="920" y="544" fill="#57606a">RBE = log compaction</text></g>
  </g>

  <!-- ===== governance nodes ===== -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="44" y="64" width="200" height="54" rx="6" fill="#ddf4ff" stroke="#0969da"/>
    <text x="144" y="86" font-weight="600" fill="#1f2328">SchemaGate</text>
    <text x="144" y="104" font-size="11" fill="#57606a">CI · fail-closed</text>
    <path d="M300,71 a105,9 0 0 1 210,0 l0,42 a105,9 0 0 1 -210,0 Z" fill="#ddf4ff" stroke="#0969da"/>
    <path d="M300,71 a105,9 0 0 0 210,0" fill="none" stroke="#0969da"/>
    <text x="405" y="92" font-weight="600" fill="#1f2328">command-policy.json</text>
    <text x="405" y="108" font-size="11" fill="#57606a">deny-by-default</text>
    <path d="M560,71 a105,9 0 0 1 210,0 l0,42 a105,9 0 0 1 -210,0 Z" fill="#ddf4ff" stroke="#0969da"/>
    <path d="M560,71 a105,9 0 0 0 210,0" fill="none" stroke="#0969da"/>
    <text x="665" y="92" font-weight="600" fill="#1f2328">UDT schema registry</text>
    <text x="665" y="108" font-size="11" fill="#57606a">SemVer</text>
  </g>

  <!-- ===== data-plane nodes ===== -->
  <g font-size="12.5" text-anchor="middle" fill="#1f2328">
    <rect x="130" y="192" width="170" height="50" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="215" y="221">OPC UA server (sim)</text>

    <rect x="40" y="272" width="170" height="58" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="125" y="295">opcua: ObjectType→UDT</text>
    <text x="125" y="313" font-size="11" fill="#57606a">+ loss ledger</text>

    <rect x="222" y="272" width="170" height="58" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="307" y="295">acl: CommandAuthorizer</text>
    <text x="307" y="313" font-size="11" fill="#57606a">fail-closed</text>

    <rect x="122" y="474" width="188" height="58" rx="6" fill="#eaf3ea" stroke="#1a7f37"/>
    <text x="216" y="497" font-weight="600">Sparkplug Edge Node</text>
    <text x="216" y="515" font-size="11" fill="#57606a">(Tahu)</text>

    <rect x="476" y="420" width="210" height="58" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="581" y="443" font-weight="600">spBv1.0/#</text>
    <text x="581" y="461" font-size="11" fill="#57606a">BIRTH · DATA · CMD</text>

    <rect x="476" y="540" width="210" height="58" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="581" y="563">retained</text>
    <text x="581" y="581" font-size="11" fill="#57606a">DEFINITION · STATE</text>

    <rect x="800" y="200" width="220" height="56" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="910" y="223">drift: DriftMonitor</text>
    <text x="910" y="241" font-size="11" fill="#57606a">detect-only</text>

    <rect x="800" y="330" width="220" height="56" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="910" y="363">Host Application</text>

    <rect x="800" y="452" width="220" height="56" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="910" y="485">kafka: stateful UNS bridge</text>

    <path d="M800,581 a110,9 0 0 1 220,0 l0,44 a110,9 0 0 1 -220,0 Z" fill="#f6f8fa" stroke="#d0d7de"/>
    <path d="M800,581 a110,9 0 0 0 220,0" fill="none" stroke="#d0d7de"/>
    <text x="910" y="606" font-weight="600">Kafka</text>
    <text x="910" y="623" font-size="11" fill="#57606a">compacted topics</text>
  </g>
</svg>
