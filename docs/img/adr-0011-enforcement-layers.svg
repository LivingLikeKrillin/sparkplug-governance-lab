<text x="52" y="70.4" font-size="24" font-family="'Pretendard','Segoe UI',system-ui,sans-serif" fill="#1e1e1e" text-anchor="start" opacity="1">NCMD authorization — command identity lives in the payload, not the topic</text>
<text x="420" y="406.6" font-size="16" font-family="'Cascadia Code','Fira Code',monospace" fill="#1e1e1e" text-anchor="middle" opacity="1">Command publisher</text>
<text x="290" y="528.5333333333334" font-size="16" font-family="'Pretendard','Segoe UI',system-ui,sans-serif" fill="#1e1e1e" text-anchor="start" opacity="1">MQTT broker — sees the TOPIC only</text>
<text x="384" y="584.8583333333333" font-size="13" font-family="'Cascadia Code','Fira Code',monospace" fill="#1e1e1e" text-anchor="middle" opacity="1">Topic ACL (node-level)</text>
<text x="169" y="722.2" font-size="16" font-family="'Pretendard','Segoe UI',system-ui,sans-serif" fill="#1e1e1e" text-anchor="start" opacity="1">Edge node — sees the PAYLOAD</text>
<text x="263" y="779.2" font-size="16" font-family="'Cascadia Code','Fira Code',monospace" fill="#1e1e1e" text-anchor="middle" opacity="1">CommandAuthorizer</text>
<text x="263" y="868.75" font-size="14" font-family="'Cascadia Code','Fira Code',monospace" fill="#1e1e1e" text-anchor="middle" opacity="1">execute (ALLOW only)</text>
<text x="84" y="151.6" font-size="16" font-family="'Pretendard','Segoe UI',system-ui,sans-serif" fill="#1e1e1e" text-anchor="start" opacity="1">Single policy source (deny-by-default)</text>
<text x="178" y="298.375" font-size="15" font-family="'Cascadia Code','Fira Code',monospace" fill="#1e1e1e" text-anchor="middle" opacity="1">command-policy.json</text>
<text x="178" y="208.6" font-size="16" font-family="'Cascadia Code','Fira Code',monospace" fill="#1e1e1e" text-anchor="middle" opacity="1">CI lint gate</text>
<text x="178" y="388.6" font-size="16" font-family="'Cascadia Code','Fira Code',monospace" fill="#1e1e1e" text-anchor="middle" opacity="1">BrokerAclProjector</text>
<text x="389.59038107227315" y="468.68582119183833" font-size="12" font-family="'Cascadia Code','Fira Code',monospace" fill="#1e1e1e" text-anchor="middle" opacity="1">PUBLISH NCMD — topic has no command name</text>
<text x="316.82221007133944" y="658.1619065443124" font-size="12" font-family="'Cascadia Code','Fira Code',monospace" fill="#1e1e1e" text-anchor="middle" opacity="1">payload forwarded (broker can't inspect metrics)</text>
<text x="249" y="823.3000000000001" font-size="12" font-family="'Cascadia Code','Fira Code',monospace" fill="#1e1e1e" text-anchor="middle" opacity="1">allowlist + range + type → ALLOW</text>
<text x="164" y="252.7" font-size="12" font-family="'Cascadia Code','Fira Code',monospace" fill="#1e1e1e" text-anchor="middle" opacity="1">lint (fail-closed)</text>
<text x="276.55734662604596" y="488.44306794859904" font-size="12" font-family="'Cascadia Code','Fira Code',monospace" fill="#1e1e1e" text-anchor="middle" opacity="1">projection ②: identity → node reachability</text>
<text x="207.180388557765" y="576.3113746100152" font-size="12" font-family="'Cascadia Code','Fira Code',monospace" fill="#1e1e1e" text-anchor="middle" opacity="1">projection ①: per-command / per-value</text>
